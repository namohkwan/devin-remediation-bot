services:
  bot:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Values are read from the local .env file, which is never committed.
      DEVIN_API_KEY: ${DEVIN_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      TARGET_REPO: ${TARGET_REPO:-namohkwan/superset}
      DATABASE_PATH: /data/remediation.db
    volumes:
      - bot-data:/data
    restart: unless-stopped

volumes:
  bot-data:
